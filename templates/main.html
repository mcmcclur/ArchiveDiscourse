<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <!-- TITLE -->
    <meta name="viewport" content="width=device-width">
    <link rel="stylesheet" href="https://use.fontawesome.com/2374bdec1c.css">
    <link rel="stylesheet" href="./archived.css" />
    <script>
      function applyCategoryFilter() {
        var hash = window.location.hash || "";
        var selected = "all";
        if (hash.indexOf("#category=") === 0) {
          selected = decodeURIComponent(hash.slice("#category=".length));
        }

        document.querySelectorAll(".category-nav a").forEach(function (link) {
          var isActive = link.dataset.category === selected;
          link.setAttribute("aria-current", isActive ? "page" : "false");
        });

        document.querySelectorAll(".topic-row").forEach(function (row) {
          var matches = selected === "all" || row.dataset.category === selected;
          row.hidden = !matches;
        });
      }

      function preprocessDiscourseMath() {
        document.querySelectorAll("span.math, div.math").forEach(function (node) {
          var tex = node.textContent || "";
          if (!tex.trim()) {
            return;
          }
          if (node.tagName === "SPAN") {
            node.textContent = "\\(" + tex + "\\)";
          } else {
            node.textContent = "\\[" + tex + "\\]";
          }
          node.classList.remove("math");
        });
      }

      window.MathJax = {
        tex: {
          inlineMath: [["\\(", "\\)"]],
          displayMath: [["\\[", "\\]"]]
        },
        startup: {
          pageReady() {
            preprocessDiscourseMath();
            applyCategoryFilter();
            return MathJax.startup.defaultPageReady();
          }
        }
      };

      window.addEventListener("hashchange", applyCategoryFilter);
      window.addEventListener("DOMContentLoaded", applyCategoryFilter);
    </script>
    <script async id="MathJax-script" src="https://cdn.jsdelivr.net/npm/mathjax@4/tex-chtml.js"></script>
  </head>

  <body>

    <header class="header">
      <div class="title-span">
        <h1 class="site-title">
          <!-- SITE_BRANDING -->
        </h1>
      </div>
    </header>

    <div class="main">
      <h1 class="archive-title"><!-- ARCHIVE_TITLE --></h1>
      <div class="archive-span"><!-- ARCHIVE_BLURB --></div>
      <div class="category-nav">Categories: <!-- CATEGORY_NAV --></div>
      <div class="topics">
        <div class="header-row">
          <span class="topic-head">Topics</span>
          <span class="category-head">Category</span>
          <span class="post-count-head">Posts</span>
        </div>
        <!-- TOPIC_LIST -->
      </div>
    </div>
  </body>
</html>
